
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Agent</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <header>
            <h1>🤖 SHAHID'S AI Study Agent</h1>
            <p>Your Personal AI Learning Assistant</p>
        </header>

        <main>

            <div class="chat-box" id="chatBox">
                <div class="message ai">
                    👋 Hello! I'm your AI Study Agent.<br><br>
                    Ask me anything about your studies!
                </div>
            </div>

            <div class="input-area">
                <input
                    type="text"
                    id="question"
                    placeholder="Ask your study question..."
                    onkeypress="handleKeyPress(event)"
                >

                <button onclick="askAI()">Ask AI</button>
            </div>

            <div class="features">

                <button onclick="studyPlanner()">
                    📅 Study Planner
                </button>

                <button onclick="quizGenerator()">
                    📝 Generate Quiz
                </button>

                <button onclick="aiTutor()">
                    📚 AI Tutor
                </button>

            </div>

        </main>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
